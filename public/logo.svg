<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Kelo logo">
  <defs>
    <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <!-- rounded app tile -->
  <rect width="512" height="512" rx="116" fill="url(#kg)"/>
  <!-- the "K": a strong vertical stem + a rising pulse/heartbeat forming the arms -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- stem -->
    <path d="M172 136 V376" stroke-width="36"/>
    <!-- upper arm of the K as a rising line (strength up) -->
    <path d="M172 256 L312 148" stroke-width="32"/>
    <!-- lower arm as a heartbeat pulse (life), landing level with the stem base -->
    <path d="M172 256 L228 312 L262 244 L296 300 L336 300 L372 376"
          stroke-width="32"/>
  </g>
</svg>
