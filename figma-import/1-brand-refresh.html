      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

ight: 600;\n  font-display: swap;\n  src: url(\"5ff34014-a62d-4d6f-bdcf-0af713eb9034\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: -divider); padding-top: 12px;\"><div><strong>Shared.<\u002Fstrong> The Key symbol, the typefaces, the grid and the spacing scale.<\u002Fdiv><div><strong>Never shared.<\u002Fstrong> Photography, the Leaf green, promotional language, and any button that asks for a signup.<\u002Fdiv><div><strong>Why.<\u002Fstrong> An auditing body that promotes itself is not independent. The split has to be visible, not just stated.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap: 12px; font-size: 13px; color: var(--color-neutral-600);\"><span style=\"font-weight:600; color: var(--color-accent-700); border-right: 1px solid var(--color-divider); padding-right: 12px;\">13<\u002Fspan><span>Green Key Global · Brand guidelines<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" id=\"b8\" data-screen-label=\"14 What we keep and what we change\">\n    <div style=\"display:flex; align-items:baseline; gap: 14px; font-size: 13px; color: var(--color-neutral-600);\"><span style=\"color: var(--color-neutral-500);\">2.2<\u002Fspan><span style=\"font-family: var(--font-heading); font-size: 24px; color: var(--color-text);\">Brand architecture<\u002Fspan><span>»<\u002Fspan><span>What we keep and what we change<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; justify-content:center; gap: 18px; min-height:0; padding: 12px 0;\"><div style=\"display:flex; justify-content:space-between; align-items:baseline; gap: 40px;\"><div style=\"font-family: var(--font-heading); font-size: 34px; line-height:1;\">Retain, refine, reposition, reinvent<\u002Fdiv><div style=\"font-size: 15px; color: var(--color-neutral-700); max-width: 460px; text-align:right;\">An honest audit of what Green Key Global already owns. Most of it stays.<\u002Fdiv><\u002Fdiv><sc-raw-table style=\"width:100%; border-collapse: collapse; font-size: 14px;\"><sc-raw-thead><sc-raw-tr style=\"border-bottom: 1px solid var(--color-text);\"><sc-raw-th style=\ le=\"padding: 8px; vertical-align: top; color:var(--color-neutral-700);\">Reposition<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px; vertical-align: top; color: var(--color-neutral-800);\">Held pending trademark review; a descriptive French line so the mark never stands alone in Quebec.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr style=\"border-bottom: 1px solid var(--color-divider);\"><sc-raw-td style=\"padding: 8px; vertical-align: top;\"><strong>Claims and statistics<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px; vertical-align: top; color:#8a5608;\">Reinvent<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px; vertical-align: top; color: var(--color-neutral-800);\">Every figure carries a source and a date. A public claims and sources page.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><div style=\"font-size: 14px; color: var(--color-neutral-700);\">This is a refresh, not a rebrand. Nothing is renamed; the equity in the existing brand is the starting capital.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap: 12px; font-size: 13px; color: var(--color-neutral-600);\"><span style=\"font-weight:600; color: var(--color-accent-700); border-right: 1px solid var(--color-divider); padding-right: 12px;\">14<\u002Fspan><span>Green Key Global · Brand guidelines<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" id=\"b9\" data-screen-label=\"15 Compliance and the word \" green\"\"=\"\">\n    <div style=\"display:flex; align-items:baseline; gap: 14px; font-size: 13px; color: var(--color-neutral-600);\"><span style=\"color: var(--color-neutral-500);\">2.3<\u002Fspan><span style=\"font-family: var(--font-heading); font-size: 24px; color: var(--color-text);\">Brand architecture<\u002Fspan><span>»<\u002Fspan><span>Compliance and the word \"green\"<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; justify-content:center; gap: 18px; min-height:0; padding: 12px 0;\"><div style=\"display:flex; justify-content:space-between; align-items:baseline; gap: 40px;\"><div style=\"font-family: var(--font-heading); font-size: 34px; line-height:1;\">Anti-greenwashing rules shape the brand<\u002Fdiv><div style=\"font-size: 15px; color: var(--color-neutral-700); max-width: 460px; text-align:right;\">Bill C-59 in Canada and the EU ECGT directive, in force 27 September 2026, require every sustainability claim to be backed up.<\u002Fdiv><\u002Fdiv><div style=\"display:grid; grid-template-columns: 1fr 1fr; gap: 32px; flex:1; align-items:center;\">\n  <div style=\"display:flex; flex-direction:column; gap: 12px; font-size: 15px; line-height:1.55;\"><div style=\"border-top: 1px solid var(--color-divider); padding-top: 10px;\"><strong>Green is a name, not a claim.<\u002Fstrong> <span style=\"color: var(--color-neutral-800);\">\"Green Key\" is our name. We never use green as shorthand for \"good for the environment\".<\u002Fspan><\u002Fdiv><div style=\"border-top: 1px solid var(--color-divider); padding-top: 10px;\"><strong>Colour is rationed.<\u002Fstrong> <span style=\"color: var(--color-neutral-800);\">Green marks the Key, the main action and certified status. A page washed in green implies a claim we have not made.<\u002Fspan><\u002Fdiv><div style=\"border-top: 1px solid var(--color-divider); padding-top: 10px;\"><strong>Ratings describe performance.<\u002Fstrong> <span style=\"color: var(--color-neutral-800);\">\"4 Keys, audited 2025\" describes measured performance. \"Eco-friendly hotel\" does not.<\u002Fspan><\u002Fdiv><div style=\"border-top: 1px solid var(--color-divider); padding-top: 10px;\"><strong>Every figure is sourced.<\u002Fstrong> <span style=\"color: var(--color-neutral-800);\">Source and date beside every statistic, and a public claims and sources page listing them all.<\u002Fspan><\u002Fdiv><div style=\"border-top: 1px solid var(--color-divider); padding-top: 10px;\"><strong>Labels meet the directive.<\u002Fstrong> <span sty tyle=\"display:flex; flex-direction:column; gap: 10px;\"><div style=\"font-size: 12px; letter-spacing:.08em; text-transform:uppercase; color: var(--color-neutral-600);\">Certification Body · verifies<\u002Fdiv><div style=\"border: 1px solid #202830; background:#fff; flex:1; display:flex; flex-direction:column; font-size: 10px;\"><div style=\"display:flex; justify-content:space-between; align-items:center; padding: 9px 11px; border-bottom: 1px solid #202830;\"><span style=\"display:flex; align-items:center; gap: 6px;\"><div style=\"width:15px; height:15px; background:#202830; display:flex; align-items:center; justify-content:center; flex:none;\"><div style=\"width:5px; height:8px; border:1.5px solid #fff; border-radius:2px 2px 1.5px 1.5px;\"><\u002Fdiv><\u002Fdiv><span style=\"font-family: var(--font-heading); font-size: 13px;\">Green Key Certification Body<\u002Fspan><\u002Fspan><span style=\"color:#7a7a7d; font-size: 9px;\">EN | FR<\u002Fspan><\u002Fdiv><div style=\"padding: 14px 11px; border-bottom: 1px solid #d4d4d7;\"><div style=\"font-family: var(--font-heading); font-size: 19px; line-height:1.05; color:#202830;\">Standards and methodology<\u002Fdiv><div style=\"color:#7a7a7d; font-size: 9px; margin-top: 4px;\">Criteria version 4 · published March 2023<\u002Fdiv><\u002Fdiv><div style=\"padding: 10px 11px; display:flex; flex-direction:column; gap: 5px;\"><div style=\"border-bottom: 1px solid #e7e7ea; padding-bottom: 4px; font-size: 9px; display:flex; justify-content:space-between;\">1 · Scope and application<span style=\"color:#7a7a7d;\">PDF<\u002Fspan><\u002Fdiv><div style=\"border-bottom: 1px solid #e7e7ea; padding-bottom: 4px; font-size: 9px; display:flex; justify-content:space-between;\">2 · The nine assessed areas<span style=\"color:#7a7a7d;\">PDF<\u002Fspan><\u002Fdiv><div style=\"border-bottom: 1px solid #e7e7ea; padding-bottom: 4px; font-size: 9px; display:flex; justify-content:space-between;\">3 · Required criteria<span style=\"color:#7a7a7d;\">PDF<\u002Fspan><\u002Fdiv><div style=\"border-bottom: 1px solid #e7e7ea; padding-bottom: 4px; font-size: 9px; display:flex; justify-content:space-between;\">4 · Audit procedure<span style=\"color:#7a7a7d;\">PDF<\u002Fspan><\u002Fdiv><div style=\"border-bottom: 1px solid #e7e7ea; padding-bottom: 4px; font-size: 9px; display:flex; justify-content:space-between;\">5 · Impartiality and complaints<span style=\"color:#7a7a7d;\">PDF<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-size: 13.5px; color: var(--color-neutral-800);\">Charcoal and paper. No photographs, no green field, no buttons that ask for anything. A numbered document, not a page.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><div style=\"display:grid; grid-template-columns: repeat(3,1fr); gap: 24px; font-size: 14px; line-height:1.45; border-top: 1px solid var(--color-divider); padding-top: 12px;\"><div><strong>Shared.<\u002Fstrong> The Key, both typefaces, the grid, the spacing scale, the accessibility rules.<\u002Fdiv><div><strong>Never shared.<\u002Fstrong> Photography, the Leaf green, the green field, and any call to action.<\u002Fdiv><div><strong>The link between them.<\u002Fstrong> One line in each footer, pointing to the other, stating the relationship in plain words.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap: 12px; font-size: 13px; color: var(--color-neutral-600);\"><span style=\"font-weight:600; color: var(--color-accent-700); border-right: 1px solid var(--color-divider); padding-right: 12px;\">50<\u002Fspan><span>Green Key Global · Brand guidelines<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" id=\"a6\" data-screen-label=\"51 The system on one page\">\n    <div style=\"display:flex; align-items:baseline; gap: 14px; font-size: 13px; color: var(--color-neutral-600);\"><span style=\"color: var(--color-neutral-500);\">8.5<\u002Fspan><span style=\"font-family: var(--font-heading); font-size: 24px; color: var(--color-text);\">Applications<\u002Fspan><span>»<\u002Fspan><span>The system on one page<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; justify-content:center; gap: 18px; min-height:0; padding: 12px 0;\"><div style=\"display:flex; justify-content:space-between; align-items:baseline; gap: 40px;\"><div style=\"font-family: var(--font-heading); font-size: 34px; line-height:1;\">The whole brand, at a glance<\u002Fdiv><div style=\"font-size: 15px; color: var(--color-neutral-700); max-width: 460px; text-align:right;\">For everyone who will never read forty-five pages. Print this and pin it up.<\u002Fdiv><\u002Fdiv><div style=\"display:grid; grid-template-columns: repeat(4,1fr); gap: 18px; flex:1; align-items:start;\">\n  <div style=\"display:flex; flex-direction:column; gap: 10px;\"><div style=\"font-size: 12px; letter-spacing:.08em; text-transform:uppercase; color:#207030;\">Mark<\u002Fdiv><div style=\"border: 1px solid var(--color-divider); background:#fff; padding: 14px; display:flex; align-items:center; justify-content:center;\"><img src=\"04211694-2143-4fb7-9c8b-6877db28a1a0\" alt=\"\" style=\"width: 100%; max-width: 130px;\"><\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-800);\">Clear space = leaf height. Minimum 96px. Below that, the Key alone.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap: 10px;\"><div style=\"font-size: 12px; letter-spacing:.08em; text-transform:uppercase; color:#207030;\">Colour<\u002Fdiv><div style=\"display:grid; grid-template-columns: repeat(5,1fr); height: 54px;\"><div style=\"background:#f1f8e8;\"><\u002Fdiv><div style=\"background:#78b828;\"><\u002Fdiv><div style=\"background:#207030;\"><\u002Fdiv><div style=\"background:#0f381b;\"><\u002Fdiv><div style=\"background:#202830;\"><\u002Fdiv><\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-800);\">80% paper, 15% charcoal, 5% green. Forest for text and buttons, Leaf for the mark.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap: 10px;\"><div style=\"font-size: 12px; letter-spacing:.08em; text-transform:uppercase; color:#207030;\">Type<\u002Fdiv><div style=\"border: 1px solid var(--color-divider); background:#fff; padding: 10px 12px;\"><div style=\"font-family: 'Zilla Slab', serif; font-weight:600; font-size: 24px; line-height:1; color:#202830;\">Zilla Slab<\u002Fdiv><div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 14px; color:#202830; margin-top: 4px;\">Source Sans 3<\u002Fdiv><\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-800);\">Slab for headlines, sans for everything else. Sentence case throughout.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap: 10px;\"><div style=\"font-size: 12px; letter-spacing:.08em; text-transform:uppercase; color:#207030;\">Rating<\u002Fdiv><div style=\"border: 1px solid var(--color-divider); background:#fff; padding: 14px; display:flex; gap: 5px; align-items:center; justify-content:center;\"><span style=\"width:18px;height:18px;background:#78b828;\"><\u002Fspan><span style=\"width:18px;height:18px;background:#78b828;\"><\u002Fspan><span style=\"width:18px;height:18px;background:#78b828;\"><\u002Fspan><span style=\"width:18px;height:18px;background:#78b828;\"><\u002Fspan><span style=\"width:18px;height:18px;border:1px solid #b7b7ba;\"><\u002Fspan><\u002Fdiv><div style=\"font-size: 13px; color: var(--color-neutral-800);\">Always with the number in words and the audit year. Never a star or a percentage.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><div style=\"display:grid; grid-template-columns: repeat(4,1fr); gap: 18px; border-top: 1px solid var(--color-divider); padding-top: 14px; font-size: 14px; line-height:1.5;\">\n  <div><strong style=\"color:#207030;\">Say<\u002Fstrong><br>\"Certified 4 Keys, audited 2025.\" Numbers with a source. Performance, not virtue.<\u002Fdiv>\n  <div><strong style=\"color:#207030;\">Never say<\u002Fstrong><br>\"Eco-friendly.\" \"Green hotels.\" Any figure without a date.<\u002Fdiv>\n  <div><strong style=\"color:#207030;\">Two voices<\u002Fstrong><br>The Scheme promotes in colour. The Body verifies in charcoal, with no buttons.<\u002Fdiv>\n  <div><strong style=\"color:#207030;\">Two languages<\u002Fstrong><br>French is a full mirror, built for lines 25% longer. Never a flag for a language.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap: 12px; font-size: 13px; color: var(--color-neutral-600);\"><span style=\"font-weight:600; color: var(--color-accent-700); border-right: 1px solid var(--color-divider); padding-right: 12px;\">51<\u002Fspan><span>Green Key Global · Brand guidelines<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdoc-page>\n<\u002Fx-dc>\n\n<\u002Fbody><\u002Fhtml>"
